<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Web Scraping HTML Example</title>
    <style>
        /* Basic element styling */
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 20px;
        }
        
        /* ID selector */
        #main-content {
            background-color: #f5f5f5;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 5px;
        }
        
        /* Class selector */
        .message {
            color: #2c3e50;
            font-weight: bold;
        }
        
        /* Element with class selector */
        p.intro {
            font-style: italic;
            color: #3498db;
        }
        
        /* Attribute selector */
        a[href^="https"] {
            color: #e74c3c;
            text-decoration: none;
        }
        
        /* Nested selector */
        ul.item-list li.item {
            padding: 5px;
            margin-left: 20px;
        }
    </style>
</head>
<body>
    <!-- Basic HTML structure -->
    <p>Hello World!</p>

    <!-- HTML with id and class attributes -->
    <div id="main-content">
        <p class="message">Welcome!</p>
    </div>

    <!-- More HTML tags for CSS selector examples -->
    <h1>Main Title</h1>
    <p>This is a normal paragraph.</p>
    <p class="intro">This is an introduction paragraph.</p>

    <div id="header">
        <p class="message">Hello from the web!</p>
    </div>

    <!-- A link and a list -->
    <a href="https://example.com" class="external-link">Visit Example</a>
    <ul class="item-list">
        <li class="item">Apple</li>
        <li class="item">Banana</li>
        <li class="item">Cherry</li>
    </ul>
</body>
</html>
